<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tactics Map</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Name entry, shown once until a callsign is saved locally -->
  <div id="nameModal" class="modal hidden">
    <div class="modal-box">
      <h2>Enter your callsign</h2>
      <input id="nameInput" type="text" maxlength="24" placeholder="e.g. Ghost, SL-2, Recon-1" />
      <button id="nameSubmit">Join</button>
    </div>
  </div>

  <header id="topbar">
    <div class="brand">Tactics Map</div>
    <div id="whoami" class="whoami"></div>
    <button id="leaveRoleBtn" class="hidden" title="Step down to Viewer so someone else can take this role">Leave Role</button>
    <div id="topActions" class="top-actions"></div>
  </header>

  <main>
    <div id="mapColumn">
      <div id="drawToolbar" class="draw-toolbar hidden">
        <div class="toolbar-group">
          <button class="toolBtn active" data-tool="pen">Pen</button>
          <button class="toolBtn" data-tool="arrow">Arrow</button>
          <button class="toolBtn" data-tool="text">Label</button>
          <button class="toolBtn" data-tool="eraser">Eraser</button>
        </div>
        <div class="toolbar-group">
          <button class="toolBtn" data-tool="wall" title="Drag to draw a wall segment">Wall</button>
          <button class="toolBtn" data-tool="wire" title="Drag to draw barbed wire">Wire</button>
          <button class="toolBtn" data-tool="gate" title="Click to place a gate">Gate</button>
        </div>
        <div class="toolbar-group">
          <button class="toolBtn" data-tool="fob" title="Click to place the FOB">FOB</button>
          <button class="toolBtn" data-tool="bunker" title="Click to place a bunker">Bunker</button>
          <button class="toolBtn" data-tool="tower" title="Click to place a watchtower">Tower</button>
          <button class="toolBtn" data-tool="aa" title="Click to place Anti-Air">AA</button>
          <button class="toolBtn" data-tool="mortar" title="Click to place a mortar pit">Mortar</button>
          <button class="toolBtn" data-tool="drill" title="Click to place a drill ground">Drill</button>
        </div>
        <div class="toolbar-group" id="colorRow"></div>
        <div class="toolbar-group">
          <button id="undoBtn">Undo My Last</button>
        </div>
      </div>

      <div id="canvasWrap">
        <div id="mapPlaceholder" class="map-placeholder">
          Waiting for Recon to upload the map image...
        </div>
        <div id="mapStage" class="map-stage hidden">
          <img id="mapImage" class="map-image hidden" alt="Tactical map" />
          <canvas id="drawCanvas"></canvas>
        </div>
        <div id="zoomControls" class="zoom-controls hidden">
          <button id="zoomInBtn" title="Zoom in">+</button>
          <div id="zoomLabel" class="zoom-label">100%</div>
          <button id="zoomOutBtn" title="Zoom out">&minus;</button>
          <button id="zoomResetBtn" title="Reset to fit">Fit</button>
        </div>
      </div>
    </div>

    <aside id="sidebar">

      <section id="onlineSection" class="panel">
        <h3>Online Now</h3>
        <div id="onlineList"></div>
      </section>

      <section id="uploadSection" class="panel hidden">
        <h3>Map Image</h3>
        <input id="mapFileInput" type="file" accept="image/*" class="hidden" />
        <button id="mapUploadBtn">Upload / Replace Map</button>
        <p class="hint">Paste (Ctrl/Cmd+V) anywhere on the page also works.</p>
      </section>

      <section id="adminSection" class="panel hidden">
        <h3>Platoon Leader Controls</h3>
        <button id="clearMapBtn" class="danger">Clear Map (image + markings)</button>
        <h4>Roster &amp; Roles</h4>
        <div id="roster"></div>
      </section>

      <section id="claimSection" class="panel">
        <h3>Claim Platoon Leader</h3>
        <input id="passcodeInput" type="password" placeholder="Passcode" />
        <button id="claimBtn">Claim</button>
      </section>

    </aside>
  </main>

  <div id="toast" class="toast hidden"></div>

  <!-- Firebase compat SDK (no build step needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
